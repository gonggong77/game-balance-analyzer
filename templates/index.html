<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Balance Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3148;
      --accent: #6c63ff;
      --accent-hover: #8b85ff;
      --text: #e8e9f0;
      --text-dim: #7b7f9e;
      --critical: #ff5c7a;
      --warning: #ffb547;
      --ok: #4cde9a;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    h1 span { color: var(--accent); }

    /* ── Drop Zone ── */
    #drop-zone {
      width: 100%;
      max-width: 700px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 52px 32px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    #drop-zone.drag-over {
      border-color: var(--accent);
      background: #1e2038;
    }
    #drop-zone .icon { font-size: 3rem; margin-bottom: 12px; }
    #drop-zone .label { font-size: 1.05rem; color: var(--text); }
    #drop-zone .sub { font-size: 0.85rem; color: var(--text-dim); margin-top: 6px; }

    /* ── File List ── */
    #file-list-wrap {
      width: 100%;
      max-width: 700px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: none;
    }
    #file-list-header {
      padding: 12px 18px;
      font-size: 0.85rem;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #file-list-header button {
      background: none;
      border: none;
      color: var(--critical);
      cursor: pointer;
      font-size: 0.8rem;
    }
    #file-list {
      list-style: none;
      max-height: 180px;
      overflow-y: auto;
      padding: 8px 0;
    }
    #file-list li {
      padding: 6px 18px;
      font-size: 0.82rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #file-list li::before { content: "📄"; font-size: 0.9rem; }

    /* ── Context + Controls ── */
    .controls {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.9rem;
      padding: 14px 16px;
      resize: vertical;
      min-height: 80px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--text-dim); }

    .btn-row { display: flex; gap: 12px; }

    button.primary {
      flex: 1;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

    button.secondary {
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 20px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    button.secondary:hover { border-color: var(--accent); color: var(--text); }

    /* ── Results ── */
    #result-wrap {
      width: 100%;
      max-width: 700px;
      display: none;
    }
    #result-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      min-height: 120px;
      white-space: pre-wrap;
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--text);
    }
    #result-box .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      animation: blink 0.9s step-end infinite;
      vertical-align: text-bottom;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Status Bar ── */
    #status {
      font-size: 0.82rem;
      color: var(--text-dim);
      width: 100%;
      max-width: 700px;
      text-align: right;
    }
    #status.error { color: var(--critical); }
    #status.ok { color: var(--ok); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

  <h1>Game Balance <span>Analyzer</span></h1>

  <!-- Drop Zone -->
  <div id="drop-zone">
    <div class="icon">📂</div>
    <div class="label">CSV 폴더를 여기에 드래그앤드롭</div>
    <div class="sub">폴더 또는 개별 CSV 파일을 드롭하세요 • 하위 폴더도 자동 탐색</div>
  </div>

  <!-- Detected Files -->
  <div id="file-list-wrap">
    <div id="file-list-header">
      <span id="file-count">0개 CSV 파일 감지됨</span>
      <button onclick="clearFiles()">✕ 초기화</button>
    </div>
    <ul id="file-list"></ul>
  </div>

  <!-- Controls -->
  <div class="controls">
    <textarea id="context-input" placeholder="추가 설명 (선택사항) — 예: '이 게임은 RPG이고 레벨 캡은 100입니다'"></textarea>
    <div class="btn-row">
      <button class="primary" id="analyze-btn" onclick="startAnalysis()" disabled>분석 시작</button>
      <button class="secondary" onclick="document.getElementById('context-input').value=''">지우기</button>
    </div>
  </div>

  <!-- Status -->
  <div id="status"></div>

  <!-- Result -->
  <div id="result-wrap">
    <div id="result-box"></div>
  </div>

  <script>
    let collectedFiles = [];

    // ── Drag & Drop ──────────────────────────────────────

    const dropZone = document.getElementById('drop-zone');

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', e => {
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
      }
    });

    dropZone.addEventListener('drop', async e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');

      const items = Array.from(e.dataTransfer.items);
      const entries = items
        .filter(i => i.kind === 'file')
        .map(i => i.webkitGetAsEntry ? i.webkitGetAsEntry() : null)
        .filter(Boolean);

      setStatus('파일 탐색 중...', '');
      const files = [];
      for (const entry of entries) {
        const found = await collectCSVs(entry);
        files.push(...found);
      }

      if (files.length === 0) {
        setStatus('CSV 파일을 찾을 수 없습니다.', 'error');
        return;
      }

      collectedFiles = files;
      renderFileList(files);
      setStatus(`${files.length}개 CSV 파일 준비 완료`, 'ok');
    });

    // ── 재귀 CSV 수집 ────────────────────────────────────

    async function collectCSVs(entry) {
      if (!entry) return [];

      if (entry.isFile) {
        if (entry.name.toLowerCase().endsWith('.csv')) {
          const file = await new Promise((res, rej) => entry.file(res, rej));
          // 경로 정보를 파일명에 보존 (선택적)
          Object.defineProperty(file, 'relativePath', { value: entry.fullPath });
          return [file];
        }
        return [];
      }

      if (entry.isDirectory) {
        const all = [];
        const reader = entry.createReader();
        // readEntries는 한 번에 최대 100개만 반환하므로 루프 필요
        let batch;
        do {
          batch = await new Promise((res, rej) => reader.readEntries(res, rej));
          for (const child of batch) {
            all.push(...await collectCSVs(child));
          }
        } while (batch.length > 0);
        return all;
      }

      return [];
    }

    // ── 파일 목록 렌더링 ──────────────────────────────────

    function renderFileList(files) {
      const wrap = document.getElementById('file-list-wrap');
      const list = document.getElementById('file-list');
      const count = document.getElementById('file-count');

      count.textContent = `${files.length}개 CSV 파일 감지됨`;
      list.innerHTML = '';
      files.forEach(f => {
        const li = document.createElement('li');
        li.textContent = f.relativePath || f.name;
        list.appendChild(li);
      });

      wrap.style.display = 'block';
      document.getElementById('analyze-btn').disabled = false;
    }

    function clearFiles() {
      collectedFiles = [];
      document.getElementById('file-list-wrap').style.display = 'none';
      document.getElementById('analyze-btn').disabled = true;
      document.getElementById('result-wrap').style.display = 'none';
      setStatus('');
    }

    // ── 분석 실행 (폴링 방식) ──────────────────────────────

    async function startAnalysis() {
      if (collectedFiles.length === 0) return;

      const btn = document.getElementById('analyze-btn');
      btn.disabled = true;
      btn.textContent = '분석 중...';

      const resultWrap = document.getElementById('result-wrap');
      const resultBox = document.getElementById('result-box');
      resultWrap.style.display = 'block';
      resultBox.innerHTML = '<span class="cursor"></span>';

      const formData = new FormData();
      collectedFiles.forEach(f => formData.append('files[]', f, f.name));

      const context = document.getElementById('context-input').value.trim();
      if (context) formData.append('context', context);
      formData.append('session_id', 'session_' + Date.now());

      setStatus('파일 업로드 중...', '');

      try {
        // 1단계: 파일 업로드 및 분석 작업 시작
        const res = await fetch('/api/analyze/stream', {
          method: 'POST',
          body: formData,
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(`서버 오류 ${res.status}: ${err}`);
        }

        const { job_id } = await res.json();
        if (!job_id) throw new Error('job_id를 받지 못했습니다.');

        setStatus('Claude AI 분석 중... (완료까지 수십 초 소요될 수 있습니다)', '');

        // 2단계: 폴링으로 결과 대기
        let dotCount = 0;
        const result = await new Promise((resolve, reject) => {
          const interval = setInterval(async () => {
            try {
              const poll = await fetch(`/api/status/${job_id}`);
              if (!poll.ok) {
                clearInterval(interval);
                reject(new Error(`폴링 오류 ${poll.status}`));
                return;
              }
              const data = await poll.json();

              if (data.status === 'done') {
                clearInterval(interval);
                resolve(data.result);
              } else if (data.status === 'error') {
                clearInterval(interval);
                reject(new Error(data.error || '분석 중 오류 발생'));
              } else {
                // 로딩 애니메이션
                dotCount = (dotCount + 1) % 4;
                const dots = '.'.repeat(dotCount + 1);
                setStatus(`Claude AI 분석 중${dots}`, '');
              }
            } catch (e) {
              clearInterval(interval);
              reject(e);
            }
          }, 2000);
        });

        // 3단계: 결과 표시
        resultBox.innerHTML = escapeHtml(result);
        setStatus('분석 완료', 'ok');

      } catch (err) {
        resultBox.innerHTML = `<span style="color:var(--critical)">오류: ${escapeHtml(err.message)}</span>`;
        setStatus('분석 실패', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '분석 시작';
      }
    }

    // ── 유틸 ─────────────────────────────────────────────

    function setStatus(msg, type = '') {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
